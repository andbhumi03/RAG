name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    name: Backend Syntax & Health Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'rag-backend/package-lock.json'

      - name: Install Backend Dependencies
        working-directory: ./rag-backend
        run: npm ci

      - name: Check Backend Syntax & Module Integrity
        working-directory: ./rag-backend
        run: |
          node --check Server.js
          node --check services/embeddings.js
          node --check services/ocr.js
          node --check services/agent/agentRunner.js
          node --check routes/chat.js
          node --check routes/Documents.js
          node --check routes/auth.js

  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'rag-assistant/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./rag-assistant
        run: npm ci

      - name: Lint Frontend
        working-directory: ./rag-assistant
        run: npm run lint

      - name: Build Production Assets
        working-directory: ./rag-assistant
        run: npm run build
